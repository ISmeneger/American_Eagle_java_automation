# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-gradle

name: Api and UI Automation

on:
  workflow_dispatch:

  pull_request:
    branches:
      - master

jobs:
  api-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582

      - name: Grant execute permission for Gradle
        run: chmod +x gradlew

      - name: Run API tests
        run: ./gradlew apiTests

      - name: Upload API Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-allure-results
          path: build/allure-results
          if-no-files-found: warn

  ui-tests:
    runs-on: ubuntu-latest

    services:
      selenium:
        image: selenium/standalone-chrome:latest
        options: --shm-size 2g
        ports:
          - 4444:4444

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582

      - name: Grant execute permission for Gradle
        run: chmod +x gradlew

      - name: Run UI tests
        env:
          SELENIUM_REMOTE_URL: http://localhost:4444/wd/hub
          EMAIL_INPUT: ${{ secrets.EMAIL }}
          PASSWORD_INPUT: ${{ secrets.PASSWORD }}
        run: ./gradlew uiTests -Denv=default -Demail=$EMAIL_INPUT -Dpassword=$PASSWORD_INPUT

      - name: Upload UI Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-allure-results
          path: build/allure-results
          if-no-files-found: warn

  allure-report:
    if: always()
    needs:
      - api-tests
      - ui-tests

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download API Allure results
        uses: actions/download-artifact@v4
        with:
          name: api-allure-results
          path: build/allure-results

      - name: Download UI Allure results
        uses: actions/download-artifact@v4
        with:
          name: ui-allure-results
          path: build/allure-results

  build:

    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write

    services:
      selenium:
        image: selenium/standalone-chrome:latest
        options: --shm-size 2g
        ports:
          - 4444:4444

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    # Configure Gradle for optimal use in GitHub Actions, including caching of downloaded dependencies.
    # See: https://github.com/gradle/actions/blob/main/setup-gradle/README.md
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0

    - name: Grant execute permission for Gradle
      run: chmod +x gradlew

    - name: Build with Gradle Wrapper
      env:
        SELENIUM_REMOTE_URL: http://localhost:4444/wd/hub
        EMAIL_INPUT: ${{ secrets.EMAIL }}
        PASSWORD_INPUT: ${{ secrets.PASSWORD }}
      run: ./gradlew allExceptDefectRemote -Denv=default -Demail=EMAIL_INPUT -Dpassword=PASSWORD_INPUT

    - name: Copy History
      uses: actions/checkout@v2
      if: always()
      with:
        ref: gh-pages
        path: gh-pages

    - name: Build Report
      uses: simple-elf/allure-report-action@v1.15
      if: always()
      with:
        allure_results: build/allure-results
        allure_history: allure-history
        keep_reports: 20

    - name: Publish Report
      if: always()
      uses: peaceiris/actions-gh-pages@v2
      env:
        PERSONAL_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        PUBLISH_BRANCH: gh-pages
        PUBLISH_DIR: allure-history
