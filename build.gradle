plugins {
    id 'java'
    id 'io.qameta.allure' version '2.12.0'
}

group = 'Ilya_S'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

ext {
    lombokVersion = '1.18.38'
    allureVersion = '2.29.1'
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    // https://mvnrepository.com/artifact/io.rest-assured/rest-assured
    testImplementation 'io.rest-assured:rest-assured:5.5.1'
    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"
    testCompileOnly "org.projectlombok:lombok:${lombokVersion}"
    testAnnotationProcessor "org.projectlombok:lombok:${lombokVersion}"
    // https://mvnrepository.com/artifact/org.seleniumhq.selenium/selenium-java
    implementation 'org.seleniumhq.selenium:selenium-java:4.50.0'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.18.2'
    testImplementation 'org.assertj:assertj-core:3.27.3'
    testImplementation 'org.awaitility:awaitility:4.3.0'
    implementation 'org.aeonbits.owner:owner:1.0.12'
    testImplementation "io.qameta.allure:allure-junit5:${allureVersion}"
    implementation "io.qameta.allure:allure-rest-assured:${allureVersion}"
    // https://mvnrepository.com/artifact/org.aspectj/aspectjweaver
    runtimeOnly("org.aspectj:aspectjweaver:1.9.23")
    implementation 'com.github.javafaker:javafaker:1.0.2'
}

test {
    useJUnitPlatform()
}

tasks.withType(Test).configureEach {
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
}

tasks.register('smoke', Test) {
    useJUnitPlatform() {
        includeTags 'smoke'
    }
}

tasks.register('positive', Test) {
    useJUnitPlatform() {
        includeTags 'positive'
    }
}

tasks.register('negative', Test) {
    useJUnitPlatform() {
        includeTags 'negative'
    }
}

tasks.register('e2e', Test) {
    useJUnitPlatform() {
        includeTags 'E2E'
    }
}

tasks.register('allTests', Test) {
    useJUnitPlatform() {
        includeTags 'UI'
        includeTags 'API'
    }
}

tasks.register('allTestsRemote', Test) {
    useJUnitPlatform() {
        includeTags 'UI'
        includeTags 'API'
    }

    maxParallelForks = 1
}

tasks.register('apiTests', Test) {
    useJUnitPlatform() {
        includeTags 'API'
        excludeTags 'UI'
    }
}

tasks.register('uiTests', Test) {
    useJUnitPlatform() {
        includeTags 'UI'
        excludeTags 'API'
    }
}

tasks.register('homePageTestsParallel', Test) {

    useJUnitPlatform() {
        includeTags 'UI'
        excludeTags 'API'
    }

    filter {
        includeTestsMatching 'tests.ui.HomePageTests'
    }

    systemProperty 'junit.jupiter.execution.parallel.enabled', 'true'
    systemProperty 'junit.jupiter.execution.parallel.mode.default', 'concurrent'

    systemProperty 'junit.jupiter.execution.parallel.config.strategy', 'fixed'
    systemProperty 'junit.jupiter.execution.parallel.config.fixed.parallelism', '2'
}




